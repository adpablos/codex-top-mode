[project]
name = "top-mode"
version = "0.1.0"
description = "Use spare AI subscription capacity on your own priorities, with a deadline and a clear report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/adpablos/top-mode"
Changelog = "https://github.com/adpablos/top-mode/blob/main/CHANGELOG.md"

# The scripts run directly with `python3 scripts/<name>.py`; nothing is installed.
# This file only holds metadata and tool settings.

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "RUF", "C90"]

[tool.ruff.lint.mccabe]
# Existing decision functions (quota observer, preflight, watcher) are dense but
# fully tested; keep new code below this ceiling.
max-complexity = 25

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/test_*.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
